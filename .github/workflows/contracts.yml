name: Contract checks

on:
  push:
    branches: [main]
    paths: ['contracts/**', '.github/workflows/contracts.yml']
  pull_request:
    branches: [main]
    paths: ['contracts/**', '.github/workflows/contracts.yml']

permissions:
  contents: read

jobs:
  test-and-analyze:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile, test, and analyze contracts
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
            npm run compile
            npm test
            npm run lint
            python -m pip install slither-analyzer
            npm run slither
          fi
