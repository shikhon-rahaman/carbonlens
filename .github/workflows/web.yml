name: Web checks

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_CACHED_DEMO_MODE: "true"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install, audit, lint, type-check, and build when configured
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
            npm run lint
            npm run typecheck
            npm audit --audit-level=high
            npm run build
            npx playwright install --with-deps chromium
            npm test
          fi
